[project]
name = "mediadir-mcp"
version = "0.1.0"
description = "MCP server for reading and editing MediaDir metadata over its HTTP API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
mediadir-mcp = "mediadir_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mediadir_mcp"]
